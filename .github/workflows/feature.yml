---
name: Feature-YourPhotographerInPrague

on:
  push:
    branches-ignore: [master, main]
  pull_request:
    branches: [master]

# Least privilege by default; jobs opt in to more.
permissions:
  contents: read

concurrency:
  group: feature-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: "eu-central-1"
  TF_VERSION: "1.12.2"

jobs:
  security_scan:
    name: security_scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Secret scanning over the full git history.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # IaC / Dockerfile / workflow misconfiguration scanning.
      - name: Checkov
        uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa # v12.3139.0
        with:
          config_file: .checkov.yaml

  terraform_lint:
    name: terraform_lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform fmt
        run: terraform fmt -check -recursive terraform/YPIP terraform/bootstrap terraform/modules/aws_security_group terraform/modules/aws_s3bucket
      - name: terraform validate
        run: |
          for d in terraform/YPIP/development terraform/bootstrap; do
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
          done

  k8s_lint:
    name: k8s_lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render kustomize overlays
        run: |
          for o in dev production; do
            echo "== $o"
            kubectl kustomize "k8s/overlays/$o" > "/tmp/k8s-$o.yaml"
            grep -c '^kind:' "/tmp/k8s-$o.yaml"
          done

  docker_build:
    name: docker_build
    runs-on: ubuntu-latest
    needs: [security_scan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build only — feature branches must not overwrite published images.
      - name: Build wordpress image
        run: docker build -f wordpress.Dockerfile -t yourphotographerinprague:${{ github.sha }} .

  terraform_plan:
    name: terraform_plan
    runs-on: ubuntu-latest
    needs: [security_scan, terraform_lint, k8s_lint]
    # PRs from forks get no OIDC token / secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> AWS, no static keys
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Configure AWS credentials (OIDC, read-only role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: terraform plan
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_admin_cidr_blocks: '["${{ vars.ADMIN_CIDR }}"]'
        run: bash ./terraform_plan.sh
