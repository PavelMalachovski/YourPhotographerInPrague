---
name: Master-YourPhotographerInPrague

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# Never run two applies against the same state at once.
concurrency:
  group: production
  cancel-in-progress: false

env:
  AWS_REGION: "eu-central-1"
  TF_VERSION: "1.12.2"
  IMAGE: pavelmalachovski/yourphotographerinprague

jobs:
  security_scan:
    name: security_scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkov
        uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa # v12.3139.0
        with:
          config_file: .checkov.yaml

  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: [security_scan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Token is passed via stdin by the action — not as `docker login -p`.
      - name: Docker Hub login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.MY_DOCKERHUB_USERNAME }}
          password: ${{ secrets.MY_DOCKERHUB_TOKEN }}
      - name: Build & push wordpress image
        run: |
          docker build -f wordpress.Dockerfile -t "$IMAGE:${GITHUB_SHA::12}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${GITHUB_SHA::12}"
          docker push "$IMAGE:latest"

  terraform_apply:
    name: terraform_apply
    runs-on: ubuntu-latest
    needs: [security_scan]
    # Protected environment: configure required reviewers and restrict
    # deployment branches to `master` in Settings -> Environments.
    # The AWS apply role trusts ONLY this environment (see terraform/bootstrap).
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Configure AWS credentials (OIDC, apply role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: terraform apply + kubespray
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          ADMIN_CIDR: ${{ vars.ADMIN_CIDR }}
        run: bash ./terraform_apply.sh

  notify:
    name: notify
    runs-on: ubuntu-latest
    needs: [docker, terraform_apply]
    if: always()
    steps:
      # Isolated job: the third-party action never sees AWS / Docker credentials.
      - name: Send telegram message
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ${{ github.actor }} pushed to ${{ github.ref_name }}
            docker: ${{ needs.docker.result }} | terraform: ${{ needs.terraform_apply.result }}
            Repository: ${{ github.repository }}
            See changes: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
