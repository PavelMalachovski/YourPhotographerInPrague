# Compose file used as the source for k8s manifests (e.g. via kompose).
# Credentials come from the environment / .env — never hard-code them here.
# In Kubernetes, map these to a Secret instead of plain env values.

volumes:
  db-data:

networks:
  wordpress-network:

services:
  db:
    container_name: wordpress_db
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    # No published port: the DB is only reachable from inside the network.
    networks:
      - wordpress-network

  wordpress:
    container_name: wordpress-site
    depends_on:
      - db
    image: pavelmalachovski/yourphotographerinprague:latest
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:?set MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    networks:
      - wordpress-network
