apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ypip

labels:
  - pairs:
      app.kubernetes.io/part-of: yourphotographerinprague
    includeSelectors: false

resources:
  - namespace.yaml
  - mysql.yaml
  - wordpress.yaml
  - ingress.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: wordpress-config
    literals:
      - MYSQL_DATABASE=wordpress
      - WORDPRESS_DB_HOST=mysql:3306

images:
  - name: wordpress-app
    newName: pavelmalachovski/yourphotographerinprague
    newTag: latest
